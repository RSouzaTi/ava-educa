<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos | AVA Educa </title>

    <link rel="stylesheet" href="../css/layout.css">

    <script src="../js/cabecalho.js" defer></script>
    <script src="../js/menu.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>

    <script
    type="module"
    src="../controller/cadastroAlunoController.js"
    ></script>  </head>

  <body>
    <header class="cabecalho">
      <span class="cabecalho__sistema">AVA Educa</span>
      <span class="cabecalho__usuario" id="nome-usuario"></span>
    </header>

    <div class="layout">
      <aside class="menu-lateral">
        <nav aria-label="Menu principal">
          <a href="./dashboard.html">Dashboard</a>

          <button type="button" disabled>Cursos</button>

          <a href="./cadastro-alunos.html">Cadastro de Alunos</a>

          <button type="button" id="botao-sair">Sair</button>
        </nav>
      </aside>
      <main class="conteudo">
        <h1>Cadastro de Alunos</h1>

        <form id="form-aluno">
          <fieldset>
            <legend>Dados pessoais</legend>

            <div>
              <label for="nome">Nome completo *</label>
              <input
                type="text"
                id="nome"
                name="nome"
                minlength="4"
                maxlength="80"
                autocomplete="name"
                required
              >
            </div>

            <div>
              <label for="genero">Gênero *</label>
              <select id="genero" name="genero" required>
                <option value="">Selecione</option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
                <option value="Outro">Outro</option>
                <option value="Prefiro não informar">
                  Prefiro não informar
                </option>
              </select>
            </div>

            <div>
              <label for="dataNascimento">Data de nascimento *</label>
              <input
                type="text"
                id="dataNascimento"
                name="dataNascimento"
                placeholder="DD/MM/AAAA"
                maxlength="10"
                required
              >
            </div>

            <div>
              <label for="cpf">CPF *</label>
              <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="000.000.000-00"
                required
              >
            </div>

            <div>
              <label for="telefone">Telefone *</label>
              <input
                type="tel"
                id="telefone"
                name="telefone"
                autocomplete="tel"
                required
              >
            </div>

            <div>
              <label for="email">E-mail *</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
              >
            </div>
          </fieldset>

          <fieldset>
            <legend>Endereço</legend>

            <div>
              <label for="cep">CEP</label>
              <input
                type="text"
                id="cep"
                name="cep"
                placeholder="00000-000"
                autocomplete="postal-code"
              >
            </div>

            <p id="feedback-cep" role="status"></p>

            <div>
              <label for="cidade">Cidade</label>
              <input type="text" id="cidade" name="cidade">
            </div>

            <div>
              <label for="estado">Estado (UF)</label>
              <input
                type="text"
                id="estado"
                name="estado"
                maxlength="2"
                placeholder="SP"
              >
            </div>
            <div>
              <label for="logradouro">Logradouro</label>
              <input type="text" id="logradouro" name="logradouro">
            </div>

            <div>
              <label for="numero">Número</label>
              <input type="text" id="numero" name="numero">
            </div>

            <div>
              <label for="complemento">Complemento</label>
              <input type="text" id="complemento" name="complemento">
            </div>

            <div>
              <label for="bairro">Bairro</label>
              <input type="text" id="bairro" name="bairro">
            </div>
          </fieldset>

          <p>* Campos obrigatórios.</p>
          <p id="feedback-aluno" role="status"></p>

          <button type="submit" id="botao-salvar" disabled>
            Salvar
          </button>
        </form>
      </main>
    </div>
  </body>
</html>
